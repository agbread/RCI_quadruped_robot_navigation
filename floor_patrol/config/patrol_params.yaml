floor_patrol:
  ros__parameters:
    patrol_mode: "partial"
    floor_list: [0, 1, 2]

    slam_ns: "/slam_toolbox"

    # 이후 수정
    serialized_map:
      "0": "/maps/floor0"
      "1": "/maps/floor1"
      "2": "/maps/floor2"

    map_yaml:
      "0": "/maps/floor0.yaml"
      "1": "/maps/floor1.yaml"
      "2": "/maps/floor2.yaml"

    # 사용할 엘리베이터 목록 (ID = 네임스페이스 접두사)
    lifts: ["lift1", "lift2"]

    # Nav2 공통
    topics:
      follow_waypoints_action: "/follow_waypoints"
      initialpose: "/initialpose"

    # 엘리베이터 토픽 키(접미사). 실제 토픽은 "/{lift_id}/{key}" 로 구성
    elevator_topics:
      cmd_floor: "cmd_floor"        # std_msgs/Int32
      cmd_z:     "cmd_z"            # std_msgs/Float64 (옵션)
      door_cmd:  "door_open"        # std_msgs/Bool (true=open)
      cabin_z:   "cabin_z"          # std_msgs/Float64
      door_pos:  "door_pos"         # std_msgs/Float64MultiArray [right,left]

    # 문/도착 판정 파라미터 (히스테리시스 제거, 진행중 판정용 vel_eps/eps_equal 추가)
    elevator_params:
      floor_heights: [0.00, 8.00, 16.00]   # m
      z_arrival_tol: 0.03                  # m
      door_open_threshold: 0.80            # >= 이면 OPEN
      door_close_threshold: 0.05           # <= 이면 CLOSED
      vel_eps: 0.01                        # 문 진행중 속도 임계 (단위: pos/sec)
      eps_equal: 0.001                     # 수치 비교 여유
    
    # 이후 수정
    timeouts:
      door_open_sec: 15.0
      elevator_arrival_sec: 60.0
      relocalize_wait_sec: 1.0

    # 층별 순찰 경유점 (마지막은 엘베 앞을 권장)
    waypoints:
      "0":
        - {x: 1.0,  y: 2.0,  yaw_deg: 0.0}
        - {x: 3.0,  y: 1.0,  yaw_deg: -90.0}
        - {x: 5.1,  y: -2.0, yaw_deg: 90.0}   # elevator front
      "1":
        - {x: -1.0, y: 1.5,  yaw_deg: 180.0}
        - {x: 0.0,  y: 0.0,  yaw_deg: 90.0}
        - {x: 4.95, y: -1.8, yaw_deg: 90.0}   # elevator front
      "2":
        - {x: -2.5, y: 3.0,  yaw_deg: 0.0}
        - {x: -0.5, y: 2.0,  yaw_deg: -90.0}
        - {x: 5.05, y: -1.9, yaw_deg: 90.0}   # elevator front

    subset:
      "0": [0, 2]
      "1": [2]
      "2": []

    # 이후 수정 map 기준 엘리베이터 앞 포즈 (엘리베이터별/층별)
    elevator_front:
      lift1:
        "0": {x: -3.65,  y: 13.916,  yaw_deg: 104.4}
        "1": {x: 12.406, y: -10.908, yaw_deg: -91.1}
        "2": {x: 12.346, y: -10.665, yaw_deg: -97.8}
      lift2:
        "0": {x: -6.033, y: 12.535,  yaw_deg: -77.6}
        "1": {x: 15.229, y: -10.174, yaw_deg: 89.5}
        "2": {x: 15.079, y: -9.842,  yaw_deg: 93.1}

    # 이후 수정 map 기준 도착 후 초기자세 앵커 (보통 엘베 앞과 동일하게 두면 관리 쉬움)
    door_anchor:
      lift1:
        "0": {x: -3.65,  y: 13.916,  yaw_deg: -75.6}
        "1": {x: 12.406, y: -10.908, yaw_deg: 88.9}
        "2": {x: 12.346, y: -10.665, yaw_deg: 82.2}
      lift2:
        "0": {x: -6.033, y: 12.535,  yaw_deg: 102.4}
        "1": {x: 15.229, y: -10.174, yaw_deg: -90.5}
        "2": {x: 15.079, y: -9.842,  yaw_deg: -86.9}

    # (옵션) map 기준 캐빈 내부 경유점: 탑승/하차 안정화
    cabin_offset:
      lift1: {forward_m: 1.8, lateral_m: 0.0, yaw_delta_deg: 0.0, speed_limit: 0.2}
      lift2: {forward_m: 1.8, lateral_m: 0.0, yaw_delta_deg: 0.0, speed_limit: 0.2}
